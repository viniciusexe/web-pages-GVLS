<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Maior Pintor do Mundo - José Samuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
  :root{
    --canvas: #FFFCF5;
    --canvas-deep: #EFE4CC;
    --ink: #33404E;
    --ink-soft: #5B6B7A;
    --blue: #4FA3D8;
    --blue-deep: #2D6A99;
    --red: #E8503A;
    --yellow: #F2B33D;
    --yellow-deep: #C9860F;
    --green: #4FAE7C;
    --purple: #8B6CC1;
    --wood: #C99A62;
    --wood-deep: #9C6B3E;
  }

  * { box-sizing: border-box; }
  html, body{ margin: 0; }
  [hidden]{ display: none !important; }

  body{
    background: var(--canvas);
    background-image:
      radial-gradient(circle at 12% 15%, rgba(79,163,216,0.16), transparent 55%),
      radial-gradient(circle at 88% 20%, rgba(232,80,58,0.12), transparent 50%),
      radial-gradient(circle at 20% 88%, rgba(79,174,124,0.14), transparent 50%),
      radial-gradient(circle at 88% 88%, rgba(242,179,61,0.16), transparent 50%);
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    overflow-x: hidden;
  }

  /* ---------------- cover / envelope ---------------- */
  .cover{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--canvas);
    transition: opacity .55s ease, transform .55s ease;
  }
  .cover::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(79,163,216,0.2), transparent 55%),
      radial-gradient(circle at 85% 25%, rgba(232,80,58,0.16), transparent 50%),
      radial-gradient(circle at 20% 85%, rgba(242,179,61,0.18), transparent 50%),
      radial-gradient(circle at 85% 85%, rgba(79,174,124,0.16), transparent 50%);
    pointer-events: none;
  }
  .cover.hide{ opacity: 0; transform: scale(1.06); pointer-events: none; }

  .cover-inner{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }

  .cover-kicker{
    margin: 0;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }

  .envelope-btn{
    background: none;
    border: none;
    padding: 10px;
    margin: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    font: inherit;
    color: inherit;
  }
  .envelope-btn:focus-visible{ outline: 3px solid var(--blue-deep); outline-offset: 6px; border-radius: 10px; }

  .envelope{ position: relative; width: 230px; height: 154px; perspective: 800px; overflow: hidden; border-radius: 8px; }
  .envelope-back{
    position: absolute; inset: 0;
    background: var(--wood);
    border-radius: 8px;
    box-shadow: 0 20px 45px -16px rgba(51,64,78,.4);
  }
  .envelope-letter{
    position: absolute; left: 16px; right: 16px; top: 10px; height: 116px;
    background: #fffdf8;
    border-radius: 5px;
    box-shadow: 0 8px 18px rgba(51,64,78,.2);
    transform: translateY(60px);
    transition: transform .55s cubic-bezier(.34,1.56,.64,1) .32s;
    display: flex; align-items: center; justify-content: center;
  }
  .envelope-letter svg{ width: 42px; height: 42px; opacity: .7; }
  .envelope-pocket{
    position: absolute; inset: 0;
    background: var(--wood);
    clip-path: polygon(0% 100%, 50% 42%, 100% 100%);
  }
  .envelope-flap{
    position: absolute; top: 0; left: 0; right: 0; height: 58%;
    background: var(--wood-deep);
    clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform .5s cubic-bezier(.5,0,.5,1);
    backface-visibility: hidden;
  }
  .envelope.open .envelope-flap{ transform: rotateX(-170deg); }
  .envelope.open .envelope-letter{ transform: translateY(-40px); }

  .seal{
    position: absolute; left: 50%; top: 36%; transform: translate(-50%,-50%);
    width: 42px; height: 42px; z-index: 2;
    transition: opacity .25s ease, transform .25s ease;
  }
  .envelope.open .seal{ opacity: 0; transform: translate(-50%,-50%) scale(.6); }

  .cover-hint{
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--blue-deep);
  }
  .cover-hint svg{ animation: bump 1.6s ease-in-out infinite; }
  @keyframes bump{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-4px); } }

  @media (prefers-reduced-motion: reduce){
    .cover, .envelope-flap, .envelope-letter, .seal{ transition: none !important; }
    .cover-hint svg{ animation: none !important; }
  }

  /* ---------------- invite card ---------------- */
  .invite{ position: relative; width: 100%; max-width: 460px; margin: 0 auto; }

  .frame{
    position: relative;
    background: var(--canvas);
    border-radius: 4px;
    padding: 3px;
    box-shadow: 0 24px 60px -20px rgba(51,64,78,0.35), 0 4px 14px rgba(51,64,78,0.12);
  }
  .frame::before{
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--wood);
    pointer-events: none;
  }

  .card{
    position: relative;
    padding: 40px 34px 32px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(79,163,216,0.14), transparent 60%),
      var(--canvas);
  }

  .paint-layer{ position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .brush-stripe{ display: block; width: 100%; height: auto; margin: 0 auto 12px; }

  .hero{ position: relative; width: 100%; height: 206px; margin: 0 auto 6px; }

  .brush{ position: absolute; filter: drop-shadow(0 6px 8px rgba(51,64,78,0.18)); }
  .brush.b1{ width: 46px; top: 2px;  left: calc(50% - 118px); }
  .brush.b2{ width: 38px; top: 26px; left: calc(50% + 84px); }
  .brush.b3{ width: 30px; top: 66px; left: calc(50% - 150px); }

  .portrait{
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 148px; height: 148px; border-radius: 50%;
    box-shadow:
      0 0 0 4px var(--canvas),
      0 0 0 7px var(--wood),
      0 14px 26px -10px rgba(51,64,78,0.45);
  }
  .portrait img{ width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 20%; display: block; }

  .theme-tag{ margin: 0; font-family: 'Permanent Marker', cursive; font-size: 1.5rem; line-height: 1.3; text-wrap: balance; }
  .theme-tag span{ display: inline-block; }
  .tag-a{ color: var(--red); transform: rotate(-2deg); }
  .tag-b{ color: var(--blue-deep); transform: rotate(1.5deg); }
  .tag-c{ color: var(--yellow-deep); transform: rotate(-1deg); }

  .eyebrow{
    margin: 8px 0 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--blue-deep);
  }

  .script-line{
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 12px 0 0;
    line-height: 1.3;
  }

  .name{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 2.9rem);
    color: var(--ink);
    margin: 4px 0 0;
    text-wrap: balance;
    line-height: 1.05;
  }

  .badge{ margin: 14px auto 0; width: 118px; height: 92px; display: flex; align-items: center; justify-content: center; }
  .badge-caption{
    margin: 2px 0 0;
    text-align: center;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--blue-deep);
  }

  .divider{ display: flex; align-items: center; gap: 10px; margin: 14px auto 22px; max-width: 260px; }
  .divider .line{ flex: 1; height: 0; border-top: 2px dashed var(--wood); }
  .divider svg{ flex-shrink: 0; }

  .details{ display: flex; flex-direction: column; gap: 12px; margin: 0 auto; }
  .detail-row{ display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.98rem; font-weight: 500; color: var(--ink); }
  .detail-row svg{ flex-shrink: 0; }
  .detail-row .sub{ color: var(--ink-soft); font-weight: 400; font-size: 0.88rem; }

  .map-button{
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 22px; padding: 13px 26px;
    background: var(--blue-deep); color: var(--canvas);
    text-decoration: none;
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 0.86rem; letter-spacing: 0.03em;
    border-radius: 999px;
    box-shadow: 0 10px 20px -8px rgba(45,106,153,0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .map-button:hover{ background: #244F73; transform: translateY(-1px); box-shadow: 0 14px 24px -8px rgba(45,106,153,0.6); }
  .map-button:focus-visible{ outline: 2px solid var(--red); outline-offset: 3px; }
  .map-button svg{ flex-shrink: 0; }

  .closing{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--red);
    margin: 22px 0 0;
    line-height: 1.3;
  }

  .foot-splatter{ margin-top: 14px; display: flex; justify-content: center; }

  @media (max-width: 380px){ .card{ padding: 32px 22px 26px; } }

  /* ---------------- entrance choreography ---------------- */
  .invite .theme-tag,
  .invite .eyebrow,
  .invite .script-line,
  .invite .name,
  .invite .badge,
  .invite .badge-caption,
  .invite .divider,
  .invite .details,
  .invite .map-button,
  .invite .closing,
  .invite .foot-splatter,
  .invite .portrait{ opacity: 0; }

  @keyframes fadeUp{ from{ opacity: 0; translate: 0 14px; } to{ opacity: 1; translate: 0 0; } }
  @keyframes popIn{ 0%{ opacity: 0; scale: .6; } 70%{ opacity: 1; scale: 1.08; } 100%{ opacity: 1; scale: 1; } }
  @keyframes pulse{ 0%, 100%{ scale: 1; } 50%{ scale: 1.035; } }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }
  @keyframes twinkle{ 0%, 100%{ opacity: .55; } 50%{ opacity: .15; } }
  @keyframes sway-b1{ 0%, 100%{ rotate: -16deg; translate: 0 0; } 50%{ rotate: -7deg; translate: 0 -5px; } }
  @keyframes sway-b2{ 0%, 100%{ rotate: 18deg; translate: 0 0; } 50%{ rotate: 9deg; translate: 0 -5px; } }
  @keyframes sway-b3{ 0%, 100%{ rotate: -8deg; translate: 0 0; } 50%{ rotate: 1deg; translate: 0 -4px; } }
  @keyframes badgeWobble{ 0%, 100%{ rotate: -4deg; } 50%{ rotate: 4deg; } }
  @keyframes wordFloat{ 0%, 100%{ translate: 0 0; } 50%{ translate: 0 -3px; } }

  .brush.b1{ rotate: -16deg; animation: sway-b1 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
  .brush.b2{ rotate: 18deg; animation: sway-b2 3s ease-in-out .3s infinite; transform-origin: 50% 90%; }
  .brush.b3{ rotate: -8deg; animation: sway-b3 2.3s ease-in-out .6s infinite; transform-origin: 50% 90%; }

  .invite.revealed .theme-tag span{ animation: wordFloat 2.6s ease-in-out infinite; }
  .invite.revealed .theme-tag .tag-a{ animation-delay: 0s; }
  .invite.revealed .theme-tag .tag-b{ animation-delay: .3s; }
  .invite.revealed .theme-tag .tag-c{ animation-delay: .6s; }

  .paint-layer .twinkle{ animation: twinkle 3s ease-in-out infinite; }

  .brush-stripe path{ stroke-dasharray: 600; stroke-dashoffset: 600; }
  .invite.revealed .brush-stripe path{ animation: draw 1s ease forwards; }
  .invite.revealed .brush-stripe path:nth-child(1){ animation-delay: .05s; }
  .invite.revealed .brush-stripe path:nth-child(2){ animation-delay: .25s; }
  .invite.revealed .brush-stripe path:nth-child(3){ animation-delay: .45s; }

  .invite.revealed .portrait{ animation: popIn .6s cubic-bezier(.34,1.56,.64,1) .1s forwards; }
  .invite.revealed .theme-tag{ animation: fadeUp .55s ease .3s forwards; }
  .invite.revealed .eyebrow{ animation: fadeUp .5s ease .4s forwards; }
  .invite.revealed .script-line{ animation: fadeUp .5s ease .48s forwards; }
  .invite.revealed .name{ animation: fadeUp .55s ease .56s forwards; }
  .invite.revealed .badge{
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) .68s forwards, badgeWobble 3.4s ease-in-out 1.4s infinite;
  }
  .invite.revealed .badge-caption{ animation: fadeUp .45s ease .84s forwards; }
  .invite.revealed .divider{ animation: fadeUp .45s ease .92s forwards; }
  .invite.revealed .details{ animation: fadeUp .5s ease 1s forwards; }
  .invite.revealed .map-button{
    animation: fadeUp .5s ease 1.12s forwards, pulse 2.4s ease-in-out 2s infinite;
  }
  .invite.revealed .closing{ animation: fadeUp .5s ease 1.24s forwards; }
  .invite.revealed .foot-splatter{ animation: fadeUp .5s ease 1.34s forwards; }

  @media (prefers-reduced-motion: reduce){
    .theme-tag, .eyebrow, .script-line, .name, .badge, .badge-caption,
    .divider, .details, .map-button, .closing, .foot-splatter, .portrait{ opacity: 1 !important; }
    .invite *{ animation: none !important; }
    .brush-stripe path{ stroke-dashoffset: 0 !important; }
  }
</style>
</head>
<body>

<noscript><style>.invite *{ opacity: 1 !important; } .cover{ display: none !important; }</style></noscript>

<div class="cover" id="cover">
  <div class="cover-inner">
    <p class="cover-kicker">Chegou uma cartinha especial para você</p>

    <button type="button" class="envelope-btn" id="envelopeBtn" aria-label="Abrir o convite">
      <span class="envelope open-target" id="envelope">
        <span class="envelope-back"></span>
        <span class="envelope-letter">
          <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 30 C6 14 14 6 20 6 C26 6 34 14 34 30" fill="none" stroke="var(--ink-soft)" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="30" r="3" fill="var(--ink-soft)"/></svg>
        </span>
        <span class="envelope-pocket"></span>
        <span class="envelope-flap"></span>
        <svg class="seal" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="16" cy="17" r="11" fill="var(--red)" opacity="0.92"/>
          <circle cx="25" cy="14" r="9" fill="var(--yellow)" opacity="0.92"/>
          <circle cx="20" cy="25" r="9" fill="var(--blue)" opacity="0.92"/>
        </svg>
      </span>
      <span class="cover-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        Toque para abrir o convite
      </span>
    </button>
  </div>
</div>

<div class="invite">
  <div class="frame">
    <div class="card">
      <svg class="paint-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <circle class="twinkle" style="animation-delay:0s" cx="8" cy="9" r="1.5" fill="var(--red)"/>
        <path class="twinkle" style="animation-delay:.3s" d="M92 4 C94 6 95 9 93.5 11.5 C92.3 13.4 89.4 13.4 88.4 11.2 C87.2 8.6 89.6 5.6 92 4 Z" fill="var(--blue)"/>
        <path class="twinkle" style="animation-delay:.6s" d="M6 28 C8 30 9 33 7.5 35.5 C6.3 37.4 3.4 37.4 2.4 35.2 C1.2 32.6 3.6 29.6 6 28 Z" fill="var(--yellow)"/>
        <circle class="twinkle" style="animation-delay:.9s" cx="94" cy="33" r="1.3" fill="var(--green)"/>
        <circle class="twinkle" style="animation-delay:1.2s" cx="9" cy="51" r="1.2" fill="var(--purple)"/>
        <path class="twinkle" style="animation-delay:1.5s" d="M91 51 C93 53 94 56 92.5 58.5 C91.3 60.4 88.4 60.4 87.4 58.2 C86.2 55.6 88.6 52.6 91 51 Z" fill="var(--red)"/>
        <path class="twinkle" style="animation-delay:.15s" d="M7 71 C9 73 10 76 8.5 78.5 C7.3 80.4 4.4 80.4 3.4 78.2 C2.2 75.6 4.6 72.6 7 71 Z" fill="var(--blue)"/>
        <circle class="twinkle" style="animation-delay:.45s" cx="93" cy="74" r="1.4" fill="var(--yellow)"/>
        <circle class="twinkle" style="animation-delay:.75s" cx="11" cy="90" r="1.2" fill="var(--green)"/>
        <path class="twinkle" style="animation-delay:1.05s" d="M89 89 C91 91 92 94 90.5 96.5 C89.3 98.4 86.4 98.4 85.4 96.2 C84.2 93.6 86.6 90.6 89 89 Z" fill="var(--purple)"/>
      </svg>

      <svg class="brush-stripe" viewBox="0 0 392 26" aria-hidden="true">
        <path d="M4 16 C60 6 90 22 140 12 C190 2 220 20 270 10 C310 3 350 16 388 8" fill="none" stroke="var(--red)" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
        <path d="M4 12 C60 20 100 6 150 18 C200 26 240 8 290 18 C330 24 360 10 388 16" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
        <path d="M4 20 C50 10 90 24 140 16 C190 8 230 22 280 14 C320 8 355 18 388 12" fill="none" stroke="var(--yellow)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
      </svg>

      <div class="hero">
        <svg class="brush b1" viewBox="0 0 40 140" aria-hidden="true">
          <rect x="14" y="52" width="12" height="68" rx="5" fill="var(--wood-deep)"/>
          <rect x="12" y="42" width="16" height="16" rx="3" fill="#B9C0C6"/>
          <path d="M12 42 C10 22 14 6 20 2 C26 6 30 22 28 42 Z" fill="var(--red)"/>
          <path d="M18 44 C17 50 21 54 20 60" stroke="var(--red)" stroke-width="2" fill="none" opacity="0.6"/>
        </svg>
        <svg class="brush b2" viewBox="0 0 40 140" aria-hidden="true">
          <rect x="14" y="52" width="12" height="68" rx="5" fill="var(--wood-deep)"/>
          <rect x="12" y="42" width="16" height="16" rx="3" fill="#B9C0C6"/>
          <path d="M12 42 C10 22 14 6 20 2 C26 6 30 22 28 42 Z" fill="var(--blue)"/>
          <path d="M18 44 C17 50 21 54 20 60" stroke="var(--blue)" stroke-width="2" fill="none" opacity="0.6"/>
        </svg>
        <svg class="brush b3" viewBox="0 0 40 140" aria-hidden="true">
          <rect x="14" y="52" width="12" height="68" rx="5" fill="var(--wood-deep)"/>
          <rect x="12" y="42" width="16" height="16" rx="3" fill="#B9C0C6"/>
          <path d="M12 42 C10 22 14 6 20 2 C26 6 30 22 28 42 Z" fill="var(--yellow)"/>

          <circle cx="70" cy="8" r="2.8" fill="var(--blue)"/>
          <path d="M95 3 C98 5 99 9 97 11.5 C95.5 13.4 92.2 13.2 91.2 10.8 C90 8 92.4 4.6 95 3 Z" fill="var(--green)"/>
          <circle cx="120" cy="8" r="2.4" fill="var(--purple)"/>
        </svg>

    </div>
  </div>
</div>

<script>
(function(){
  var envelope = document.getElementById('envelope');
  var trigger = document.getElementById('envelopeBtn');
  var cover = document.getElementById('cover');
  var invite = document.querySelector('.invite');
  var opened = false;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function openInvite(){
    if(opened) return;
    opened = true;
    envelope.classList.add('open');
    var flapDelay = reduced ? 0 : 700;
    var hideDelay = reduced ? 50 : 1350;
    window.setTimeout(function(){
      cover.classList.add('hide');
      invite.classList.add('revealed');
    }, flapDelay);
    window.setTimeout(function(){ cover.hidden = true; }, hideDelay);
  }
  trigger.addEventListener('click', openInvite);
})();
</script>

</body>
</html>
