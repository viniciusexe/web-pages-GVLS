<title>1 Aninho do José Samuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
  :root{
    --cream: #FFFBF2;
    --cream-deep: #F3E9D4;
    --blue: #AFD1E6;
    --blue-deep: #4E7C9C;
    --gold: #E2932A;
    --gold-light: #FFCF56;
    --gold-pale: #FFEFC2;
    --coral: #FF8F73;
    --mint: #6FC9AE;
    --ink: #33404E;
    --ink-soft: #5B6B7A;
    --page-bg: #E9EEF2;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--page-bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(175,209,230,0.35), transparent 55%),
      radial-gradient(circle at 85% 80%, rgba(223,192,119,0.25), transparent 50%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
  }

  .invite{
    position: relative;
    width: 100%;
    max-width: 460px;
  }

  .frame{
    position: relative;
    background: var(--cream);
    border-radius: 4px;
    padding: 3px;
    box-shadow: 0 24px 60px -20px rgba(51,64,78,0.35), 0 4px 14px rgba(51,64,78,0.12);
  }

  .frame::before{
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--gold-light);
    pointer-events: none;
  }

  .card{
    position: relative;
    padding: 40px 34px 32px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(175,209,230,0.28), transparent 60%),
      var(--cream);
  }

  .bunting{
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto 10px;
  }

  .hero{
    position: relative;
    width: 100%;
    height: 208px;
    margin: 0 auto 6px;
  }

  .balloon{
    position: absolute;
    filter: drop-shadow(0 6px 10px rgba(51,64,78,0.16));
  }
  .balloon.b1{ width: 58px; top: 0; left: calc(50% - 122px); transform: rotate(-9deg); }
  .balloon.b2{ width: 48px; top: 22px; left: calc(50% + 82px); transform: rotate(11deg); }
  .balloon.b3{ width: 36px; top: 60px; left: calc(50% - 156px); transform: rotate(7deg); }

  .portrait{
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 148px;
    height: 148px;
    border-radius: 50%;
    box-shadow:
      0 0 0 4px var(--cream),
      0 0 0 5.5px var(--gold-light),
      0 14px 26px -10px rgba(51,64,78,0.45);
  }

  .portrait img{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 20%;
    display: block;
  }

  .confetti-layer{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .eyebrow{
    margin: 0;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .script-line{
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--blue-deep);
    margin: 14px 0 0;
    line-height: 1.3;
  }

  .name{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 2.9rem);
    color: var(--ink);
    margin: 4px 0 0;
    text-wrap: balance;
    line-height: 1.05;
  }

  .badge{
    margin: 10px auto 0;
    width: 96px;
    height: 122px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .badge-caption{
    margin: 0;
    text-align: center;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--blue-deep);
  }

  .divider{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px auto 22px;
    max-width: 260px;
  }
  .divider .line{
    flex: 1;
    height: 0;
    border-top: 2px dashed var(--gold-light);
  }
  .divider svg{ flex-shrink: 0; }

  .details{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 0 auto;
  }

  .detail-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--ink);
  }

  .detail-row svg{ flex-shrink: 0; }

  .detail-row .sub{
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 0.88rem;
  }

  .map-button{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    padding: 13px 26px;
    background: var(--blue-deep);
    color: var(--cream);
    text-decoration: none;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.86rem;
    letter-spacing: 0.03em;
    border-radius: 999px;
    box-shadow: 0 10px 20px -8px rgba(78,124,156,0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .map-button:hover{
    background: #3F6883;
    transform: translateY(-1px);
    box-shadow: 0 14px 24px -8px rgba(78,124,156,0.6);
  }
  .map-button:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .map-button svg{ flex-shrink: 0; }

  .closing{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--blue-deep);
    margin: 22px 0 0;
    line-height: 1.3;
  }

  .foot-ornament{
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }

  @media (max-width: 380px){
    .card{ padding: 32px 22px 26px; }
  }
</style>
